services:
  oracle:
    # Community image (gvenzl/oracle-free) — Oracle's own registry images
    # require registry auth, which is awkward for local dev. Swap for the
    # official image + registry credentials if that's a hard requirement.
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: app
      APP_USER: app
      APP_USER_PASSWORD: app
    ports: ["1521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

  prometheus:
    image: prom/prometheus:latest
    ports: ["9091:9090"]
    volumes: ["./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  oracle-data:
